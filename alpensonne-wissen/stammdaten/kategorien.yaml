# Zimmer- und Apartmentkategorien – Alpensonne Tegernsee
# Eine Kategorie = ein Eintrag. Codes entsprechen den ibelsa-Kategorienamen.
# status: bestaetigt = von Benno bestätigt | website = von der Website übernommen, noch nicht bestätigt | konflikt = Quellen widersprechen sich
# Stand: 2026-11-01
#
# Ausstattung je einzelnem Zimmer: stammdaten/zimmer.yaml (Quelle: Zimmerausstattungsliste, 01.11.2026, bestaetigt).
# Bei Gästefragen zu einem konkreten Zimmer (Hund, Badewanne, Blick, Zustellbett) immer zimmer.yaml nutzen –
# die Kategorie sagt nur, was es in der Kategorie gibt, nicht, dass es jedes Zimmer hat.
#
# Belegung (seit 01.11.2026):
#   max_erwachsene         = höchste Zahl Erwachsene in der Kategorie (entspricht den am 27.10. bestätigten Werten)
#   max_personen_inkl_kinder = Spanne je Zimmer laut Zimmerliste (Erwachsene + Kinder, inkl. Zustell-/Babybett)
#   ibelsa_gaeste_max      = Wert "Gäste max." aus ibelsa (Blatt "Kategorien") – weicht teils ab, siehe offen.md
# hunde: je Zimmer geregelt (zimmer.yaml); hier nur die Zimmer, in denen Hunde erlaubt sind.

